<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Candidatos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <h1>Cadastro de Candidatos</h1>
    <form id="form-candidato" class="form-box">
        <input type="text" id="nome" placeholder="Nome do candidato" required>
        <input type="text" id="partido" placeholder="Partido" required>
        <input type="number" id="numero" placeholder="Número" required>
        <button type="submit">Cadastrar</button>
    </form>

    <div id="grid-candidatos" class="grid-candidatos"></div>

    <script src="js/script.js"></script>
</body>
</html>
