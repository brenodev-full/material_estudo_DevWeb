<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Adivinhação - Versão Prompt</title>
</head>
<body>
    <h1>Jogo de Adivinhação (Prompt)</h1>
    <p>Abra ou recarregue a página para jogar via caixas de diálogo do navegador.</p>
    <button onclick="jogar()">Jogar Novamente</button>

    <script>
        function jogar() {
            const numeroSecreto = Math.floor(Math.random() * 100) + 1;
            let tentativas = 0;
            let acertou = false;

            while (!acertou) {
                const entrada = prompt("Adivinhe o número entre 1 e 100:");
                if (entrada === null) break;

                const chute = parseInt(entrada);
                if (isNaN(chute)) {
                    alert("Por favor, digite um número válido!");
                    continue;
                }

                tentativas++;
                if (chute === numeroSecreto) {
                    alert(`Parabéns! Você acertou o número ${numeroSecreto} em ${tentativas} tentativas!`);
                    acertou = true;
                } else if (chute < numeroSecreto) {
                    alert("O número secreto é MAIOR.");
                } else {
                    alert("O número secreto é MENOR.");
                }
            }
        }
        jogar();
    </script>
</body>
</html>
