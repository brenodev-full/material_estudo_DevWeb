<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .box { display: inline-block; padding: 25px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        input { padding: 8px; width: 80px; font-size: 16px; text-align: center; }
        button { padding: 8px 16px; font-size: 16px; margin-left: 8px; cursor: pointer; }
        #mensagem { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Adivinhe o Número (1 a 100)</h2>
        <p>Tente adivinhar o número secreto que o computador escolheu!</p>
        <input type="number" id="palpite" min="1" max="100">
        <button id="btn-tentar">Chutar</button>
        <p id="mensagem"></p>
        <p id="tentativas"></p>
    </div>

    <script>
        const numeroSecreto = Math.floor(Math.random() * 100) + 1;
        let tentativas = 0;

        const input = document.getElementById('palpite');
        const btn = document.getElementById('btn-tentar');
        const msg = document.getElementById('mensagem');
        const count = document.getElementById('tentativas');

        btn.addEventListener('click', () => {
            const chute = parseInt(input.value);
            if (isNaN(chute) || chute < 1 || chute > 100) {
                msg.textContent = 'Digite um número válido entre 1 e 100.';
                return;
            }
            tentativas++;
            if (chute === numeroSecreto) {
                msg.textContent = `🎉 Parabéns! Você acertou o número ${numeroSecreto}!`;
                msg.style.color = 'green';
                btn.disabled = true;
                input.disabled = true;
            } else if (chute < numeroSecreto) {
                msg.textContent = 'O número secreto é MAIOR!';
                msg.style.color = '#e67e22';
            } else {
                msg.textContent = 'O número secreto é MENOR!';
                msg.style.color = '#e67e22';
            }
            count.textContent = `Tentativas: ${tentativas}`;
            input.value = '';
            input.focus();
        });
    </script>
</body>
</html>
