<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação com Regex</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; line-height: 1.5; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .valido { border-color: #28a745; }
        .invalido { border-color: #dc3545; }
        .msg { font-size: 0.85em; margin-top: 4px; }
        .msg.ok { color: #28a745; }
        .msg.erro { color: #dc3545; }
    </style>
</head>
<body>
    <h2>Validação com Expressões Regulares</h2>
    <form id="form-regex">
        <div class="campo">
            <label for="email">E-mail:</label>
            <input type="text" id="email" placeholder="exemplo@dominio.com">
            <span class="msg" id="msg-email"></span>
        </div>
        <div class="campo">
            <label for="telefone">Telefone (com DDD):</label>
            <input type="text" id="telefone" placeholder="(11) 98765-4321">
            <span class="msg" id="msg-tel"></span>
        </div>
        <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="123.456.789-00">
            <span class="msg" id="msg-cpf"></span>
        </div>
        <div class="campo">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="12345-678">
            <span class="msg" id="msg-cep"></span>
        </div>
    </form>

    <script>
        const regexes = {
            email: /^[\w.-]+@[\w.-]+\.[a-zA-Z]{2,}$/,
            telefone: /^\(?\d{2}\)?\s?9?\d{4}-?\d{4}$/,
            cpf: /^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$/,
            cep: /^\d{5}-?\d{3}$/
        };

        function validar(input, regex, spanMsg, textoErro) {
            if (input.value.trim() === '') {
                input.className = '';
                spanMsg.textContent = '';
                return;
            }
            if (regex.test(input.value.trim())) {
                input.className = 'valido';
                spanMsg.className = 'msg ok';
                spanMsg.textContent = '✓ Válido';
            } else {
                input.className = 'invalido';
                spanMsg.className = 'msg erro';
                spanMsg.textContent = '✗ ' + textoErro;
            }
        }

        document.getElementById('email').addEventListener('input', e => validar(e.target, regexes.email, document.getElementById('msg-email'), 'E-mail inválido'));
        document.getElementById('telefone').addEventListener('input', e => validar(e.target, regexes.telefone, document.getElementById('msg-tel'), 'Telefone inválido'));
        document.getElementById('cpf').addEventListener('input', e => validar(e.target, regexes.cpf, document.getElementById('msg-cpf'), 'CPF inválido'));
        document.getElementById('cep').addEventListener('input', e => validar(e.target, regexes.cep, document.getElementById('msg-cep'), 'CEP inválido'));
    </script>
</body>
</html>
