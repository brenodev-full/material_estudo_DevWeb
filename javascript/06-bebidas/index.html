<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio de Bebidas</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        input[type="number"] { width: 60px; padding: 5px; }
        .total-box { margin-top: 20px; font-size: 1.2em; font-weight: bold; text-align: right; }
    </style>
</head>
<body>
    <h2>Cardápio de Bebidas</h2>
    <div id="lista-bebidas"></div>
    <div class="total-box">
        Total do Pedido: R$ <span id="valor-total">0,00</span>
    </div>

    <script>
        const cardapio = [
            { id: 1, nome: "Café Expresso", preco: 5.50 },
            { id: 2, nome: "Suco Natural de Laranja", preco: 8.00 },
            { id: 3, nome: "Refrigerante Lata", preco: 6.00 },
            { id: 4, nome: "Água Mineral", preco: 4.00 }
        ];

        const container = document.getElementById('lista-bebidas');
        const spanTotal = document.getElementById('valor-total');

        cardapio.forEach(bebida => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <span>${bebida.nome} - <strong>R$ ${bebida.preco.toFixed(2).replace('.', ',')}</strong></span>
                <input type="number" min="0" value="0" data-preco="${bebida.preco}" class="qtd">
            `;
            container.appendChild(div);
        });

        document.querySelectorAll('.qtd').forEach(input => {
            input.addEventListener('input', () => {
                let total = 0;
                document.querySelectorAll('.qtd').forEach(campo => {
                    const qtd = parseInt(campo.value) || 0;
                    const preco = parseFloat(campo.dataset.preco);
                    total += qtd * preco;
                });
                spanTotal.textContent = total.toFixed(2).replace('.', ',');
            });
        });
    </script>
</body>
</html>
