<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Exemplo JavaScript</title>
    <style>
        /* ============================================
           Estilos da Página de Login
           ============================================ */

        /* Reset básico e fonte global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container do formulário de login */
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 28px;
        }

        .login-container p.subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Grupos de input */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        /* Botão de login */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Mensagem de erro inline */
        .mensagem-erro {
            color: #e74c3c;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
        }

        /* Credenciais de teste */
        .credenciais {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .credenciais p {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .credenciais strong {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- ============================================
         Formulário de Login
         ============================================ -->
    <div class="login-container">
        <h1>🔐 Login</h1>
        <p class="subtitulo">Faça login para acessar o sistema</p>

        <!-- Formulário com id para seleção via JavaScript -->
        <form id="formulario-login">
            <!-- Campo de usuário -->
            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    required
                    autocomplete="username"
                >
            </div>

            <!-- Campo de senha -->
            <div class="input-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                    autocomplete="current-password"
                >
            </div>

            <!-- Botão de envio -->
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <!-- Área para mensagens de erro exibidas via JS -->
        <p id="mensagem-erro" class="mensagem-erro"></p>

        <!-- Dica com as credenciais de teste -->
        <div class="credenciais">
            <p>📋 <strong>Credenciais de teste:</strong></p>
            <p>Usuário: <strong>admin</strong></p>
            <p>Senha: <strong>1234</strong></p>
        </div>
    </div>

    <!-- Script externo com a lógica de autenticação -->
    <script src="script.js"></script>
</body>
</html>
