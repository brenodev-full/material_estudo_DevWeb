<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas de Alunos</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        .aprovado { color: green; font-weight: bold; }
        .reprovado { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Cadastro de Notas e Médias</h2>
    <div class="form-row">
        <input type="text" id="nome" placeholder="Nome do aluno" style="flex: 2;">
        <input type="number" id="n1" placeholder="Nota 1" min="0" max="10" step="0.1" style="flex: 1;">
        <input type="number" id="n2" placeholder="Nota 2" min="0" max="10" step="0.1" style="flex: 1;">
        <button id="btn-adicionar">Adicionar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Média</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
    </table>

    <script>
        const btn = document.getElementById('btn-adicionar');
        const corpo = document.getElementById('tabela-corpo');

        btn.addEventListener('click', () => {
            const nome = document.getElementById('nome').value.trim();
            const n1 = parseFloat(document.getElementById('n1').value);
            const n2 = parseFloat(document.getElementById('n2').value);

            if (!nome || isNaN(n1) || isNaN(n2)) {
                alert('Preencha todos os campos corretamente!');
                return;
            }

            const media = ((n1 + n2) / 2).toFixed(1);
            const aprovado = media >= 7;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${nome}</td>
                <td>${n1.toFixed(1)}</td>
                <td>${n2.toFixed(1)}</td>
                <td>${media}</td>
                <td class="${aprovado ? 'aprovado' : 'reprovado'}">${aprovado ? 'Aprovado' : 'Reprovado'}</td>
            `;
            corpo.appendChild(tr);

            document.getElementById('nome').value = '';
            document.getElementById('n1').value = '';
            document.getElementById('n2').value = '';
        });
    </script>
</body>
</html>
